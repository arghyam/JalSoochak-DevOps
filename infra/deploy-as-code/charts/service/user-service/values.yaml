# Common Labels
labels:
  app: "user-service"
  group: "core"


ingress:
  enabled: true
  # zuul: true
  contexts:
    - "api/v1/auth"
    - "api/v1/users"
    - "api/v1/state-admin/pump-operators"
    - "api/v1/tenant/user"
    - "api/v1/pumpoperator"
# Init Containers Configs

# Container Configs
image:
  repository: "252649026375.dkr.ecr.ap-south-1.amazonaws.com/user-service"
  tag: "bb1931f8fe14264544db5b7b5d8f621d7f71f411"
replicas: "1"
# tracing-enabled: true
# healthChecks:
#   enabled: true
#   livenessProbePath: "/management-service/health"
#   readinessProbePath: "/management-service/health"

# Additional Container Envs
env: |
  - name: SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE
    value: 100MB
  - name: SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE
    value: 100MB
  - name: SPRING_HIKARI_MINIMUM_IDLE
    value: "20"
  - name: SPRING_HIKARI_MAXIMUM_POOL_SIZE
    value: "60"
  - name: JAVA_OPTS
    value: -Xmx512m -Xms512m
  - name: spring.flyway.baseline-on-migrate
    value: "true"
  - name: SERVER_PORT
    value: "8080"
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    value: "kafka-kraft-controller-headless:9092"
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      secretKeyRef:
        key: db-url
        name: jalsoochak
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        key: username
        name: jalsoochak
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: jalsoochak
  - name: KEYCLOAK_AUTH_SERVER_URL
    value: "http://keycloak:80/keycloak"
  - name: SPRING_MAIL_USERNAME
    valueFrom:
      secretKeyRef:
        key: mail-username
        name: jalsoochak
  - name: SPRING_MAIL_PASSWORD
    valueFrom:
      secretKeyRef:
        key: mail-password
        name: jalsoochak
  - name: MAIL_FROM_EMAIL
    valueFrom:
      secretKeyRef:
        key: mail-id
        name: jalsoochak
  - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_DEBUG
    value: "true"
  - name: KEYCLOAK_PUBLIC_KEY
    valueFrom:
      secretKeyRef:
        key: keycloak-public-key
        name: jalsoochak
  - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
    value: "http://servicediscovery:8761/eureka"
  - name: FRONTEND_BASE_URL
    value: "https://jalsoochak.beehyv.com"
  - name: CORS_ALLOWED_ORIGINS
    value: "http://localhost:3000/, https://jalsoochak.beehyv.com"
  - name: KEYCLOAK_CLIENT_ID
    value: "jalsoochak-app"
  - name: KEYCLOAK_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        key: keycloak-credential-secret
        name: jalsoochak
  - name: KEYCLOAK_ADMIN_CLIENT_ID
    value: "jalsoochak-admin"
  - name: KEYCLOAK_ADMIN_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        key: keycloak-admin-client-secret
        name: jalsoochak
  - name: KEYCLOAK_ISSUER_URI
    valueFrom:
      secretKeyRef:
        key: keycloak-issuer-uri
        name: jalsoochak
  - name: OTP_EXPIRY_MINUTES
    value: "5"
  - name: OTP_MAX_ATTEMPTS
    value: "3"
  - name: OTP_COOLDOWN_SECONDS
    value: "60"
  - name: OTP_LENGTH
    value: "6"
  - name: OTP_DELIVERY_CHANNEL
    value: "SMS"
  - name: OTP_CHEAT_ENABLED
    value: "true"
  - name: OTP_CHEAT_VALUE
    value: "123456" 
  - name: PII_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        key: pii-encryption-key
        name: jalsoochak
  - name: PII_HMAC_KEY
    valueFrom:
      secretKeyRef:
        key: pii-hmac-key
        name: jalsoochak
  - name: STAFF_MANAGED_PASSWORD_KEY
    valueFrom:
      secretKeyRef:
        key: staff-managed-password-key
        name: jalsoochak
  - name: SINGLE_TENANT_MODE
    value: "true"
  - name: STORAGE_ENDPOINT
    valueFrom:
      secretKeyRef:
        key: endpoint
        name: minio
  - name: STORAGE_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        key: accessKey
        name: minio
  - name: STORAGE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        key: secretKey
        name: minio
  - name: STORAGE_REGION
    valueFrom:
      secretKeyRef:
        key: region
        name: minio
  - name: STORAGE_PRESIGNED_BASE_URL
    valueFrom:
      secretKeyRef:
        key: presigned-url
        name: minio
  - name: STORAGE_ENABLED
    value: 'true'
  - name: STORAGE_BUCKET
    value: "tenant-assest"
  - name: STORAGE_REPORTS_BUCKET
    value: "jalsoochak-reports"
  - name: STORAGE_PRESIGNED_TTL_SECONDS
    value: "3600"
  - name: CAPTCHA_ENABLED
    value: 'true'
  - name: CAPTCHA_SECRET_KEY
    valueFrom:
      secretKeyRef:
        key: captcha-secret-key
        name: jalsoochak
    
