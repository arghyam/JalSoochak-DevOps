# Common Labels
labels:
  app: "jalsoochak-frontend"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: false
  context: ""
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: >
      more_set_headers "Content-Security-Policy:
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob:;
      object-src 'none';
      base-uri 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
      block-all-mixed-content;";
# Init Containers Configs

# Container Configs
image:
  repository: "252649026375.dkr.ecr.ap-south-1.amazonaws.com/jalsoochak-frontend"
  tag: "675cba8da7afdf742f6c24ca4549dc3c3a2d5393"
replicas: "1"
tracing-enabled: true
httpPort: 80
healthChecks:
  enabled: true
  livenessProbePath: ""
  readinessProbePath: ""

extraVolumes: |
  - name: configmap
    configMap:
      name: frontend-env

extraVolumeMounts: |
  - mountPath: /usr/share/nginx/html/config.js
    name: configmap
    subPath: config.js
