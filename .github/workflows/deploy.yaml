name: Reusable Helm Deployment

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Service name to deploy'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag'
        required: true
        type: string

  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:
  Helm-Deployment:
    name: Deployment for ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig

    steps:
      # 1. Checkout DevOps repository
      - name: Checkout DevOps Repo
        uses: actions/checkout@v4
        with:
          repository: arghyam/JalSoochak-Devops
          ref: staging
          fetch-depth: 0

      # 2. Install Helmfile with Helm 3
      - name: Install Helmfile
        uses: helmfile/helmfile-action@v1.9.0
        with:
          helmfile-version: 'v1.8.4'
          helm-version: 'v3.22.1'
          helmfile-auto-init: false
          helmfile-workdirectory: .
          helm-plugins: https://github.com/databus23/helm-diff

      # 3. Verify Helm and Helmfile versions
      - name: Verify Helm Setup
        shell: bash
        run: |
          set -euo pipefail

          echo "Helm binary:"
          which helm

          echo "Helm version:"
          helm version --short

          echo "Helmfile version:"
          helmfile --version

          echo "Installed Helm plugins:"
          helm plugin list

          if ! helm version --short | grep -q 'v3\.22\.1'; then
            echo "ERROR: Expected Helm v3.22.1"
            exit 1
          fi

      # 4. Configure Kubernetes access
      - name: Configure Kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$KUBECONFIG_CONTENT" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"

          echo "Kubeconfig configured."

      # 5. Deploy selected service
      - name: Helm Deployment
        working-directory: infra/deploy-as-code
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===================================="
          echo "Deploying service: $SERVICE_NAME"
          echo "Image tag: $IMAGE_TAG"
          echo "===================================="

          if [ "$SERVICE_NAME" = "tenant-service" ]; then
            helmfile \
              -f jalsoochak-helmfile.yaml \
              --selector "name=$SERVICE_NAME" \
              apply \
              --set "$SERVICE_NAME.image.tag=$IMAGE_TAG" \
              --set "$SERVICE_NAME.initContainers.dbMigration.image.tag=$IMAGE_TAG"
          else
            helmfile \
              -f jalsoochak-helmfile.yaml \
              --selector "name=$SERVICE_NAME" \
              apply \
              --set "$SERVICE_NAME.image.tag=$IMAGE_TAG"
          fi
